name: Local readiness checks

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: ci-only-root
                    MYSQL_DATABASE: blog_ci
                    MYSQL_USER: blog_ci
                    MYSQL_PASSWORD: ci-only-password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -pci-only-root"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        env:
            DATABASE_URL: mysql://blog_ci:ci-only-password@127.0.0.1:3306/blog_ci
            NEXTAUTH_URL: http://localhost:3000
            SITE_URL: http://localhost:3000
            NEXTAUTH_SECRET: ci-only-not-for-production-replace-this-secret
            ADMIN_PATH: /studio-ci-checks
            HUSKY: '0'
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.12.4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.17.0
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm prisma generate
            # This is an empty, disposable CI database, never the live database.
            - run: pnpm prisma db push
            - run: pnpm check
            - name: API regression
              run: |
                  pnpm start > /tmp/blog-ci.log 2>&1 &
                  APP_PID=$!
                  trap 'kill "$APP_PID" || true' EXIT
                  for attempt in $(seq 1 30); do
                    if curl --fail --silent http://localhost:3000/api/tags > /dev/null; then break; fi
                    sleep 1
                  done
                  TEST_BASE_URL=http://localhost:3000 node --test tests/api.integration.test.mjs
